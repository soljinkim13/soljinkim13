# 최근 1년 잔디 위를 지나가는 뱀 그림을 매일 output 브랜치에 새로 그린다.
name: snake

on:
  schedule:
    - cron: "17 18 * * *" # 한국 시간 03:17
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#D9825B&color_dots=#E6E6DA,#C9D8C0,#93B48F,#4F7F5C,#1F4A33
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#E49A74&color_dots=#1A231E,#23402F,#2F6A47,#5FA273,#A8D8A2
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
