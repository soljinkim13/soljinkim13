# 잔디를 입체 막대로 그린 그림(profile-3d-contrib/*.svg)을 매일 새로 만든다.
name: profile-3d-contrib

on:
  schedule:
    - cron: "17 18 * * *" # 한국 시간 03:17
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          if git commit -m "잔디 그림 갱신"; then
            git push
          fi
